aid: mursion
name: Mursion
description: >-
  Mursion is an AI-powered immersive upskilling platform that trains workforce soft skills — leadership,
  customer service, sales, healthcare communication and difficult conversations — through simulated
  conversations with virtual avatars. Simulations run either human-powered (Mursion Live, where a
  certified Simulation Specialist puppets the avatar in real time) or AI-powered (Mursion On-Demand),
  and are delivered and administered through the Mursion Portal, a browser-based web application for
  scheduling, cohorts, pathways, session reports and learner analytics. Mursion publishes no public
  developer program, API reference or machine-readable contract; its documented integration surface is
  enterprise identity — SAML 2.0 and OpenID Connect single sign-on with just-in-time provisioning and
  team assignment via an IdP claim — documented in the customer-facing knowledge base for IT teams.
