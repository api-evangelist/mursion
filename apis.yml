  reason: no-developer-program
  detail: >-
    Mursion ships only an end-user product — the browser-based Mursion Portal — and runs no
    developer program of any kind: no developer subdomain resolves, no API reference or spec is
    served on any Mursion host, and the AWS API Gateway behind the portal (apiaws.mursion.com)
    answers 403 "Missing Authentication Token" on every path including /openapi.json; the only
    integration Mursion documents publicly is SAML 2.0 / OpenID Connect single sign-on for
    customer IT teams.
